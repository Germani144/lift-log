#splash .shaft i:nth-child(2){animation-delay:.12s}#splash .shaft i:nth-child(3){animation-delay:.24s}#splash .shaft i:nth-child(4){animation-delay:.36s}#splash .shaft i:nth-child(5){animation-delay:.48s}
@keyframes ld{from{background:var(--bd)}to{background:var(--fg)}}

<body><div id="splash" aria-hidden="true"><img src="icon-192.png" width="132" height="132" alt=""><b>Lift Log</b><span id="sver"></span><div class="bb"><i class="pl pb"></i><i class="pl pr"></i><i class="sl"></i><div class="shaft"><i></i><i></i><i></i><i></i><i></i></div><i class="sl"></i><i class="pl pr"></i><i class="pl pb"></i></div></div><div id="app"></div><div id="toast" hidden></div>
<script>
const $=(s,e=document)=>e.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bb=(n,done,cur,label)=>`<div class=bb role=img aria-label="${esc(label)}"><i class="pl pb"></i><i class="pl pr"></i><i class=sl></i><div class=shaft>${Array.from({length:n},(_,i)=>`<i${i<done?' class=d':cur&&i==done?' class=n':''}></i>`).join('')}</div><i class=sl></i><i class="pl pr"></i><i class="pl pb"></i></div>`;
const NI={train:'<svg viewBox="0 0 24 24"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>',hist:'<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',tpl:'<svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>',ex:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>'};
const scTo=(x,y)=>{const m=$('main');if(m)m.scrollTop=y},scY=()=>$('main')?.scrollTop||0;   // the page scrolls inside <main>, not the window
const VER='1.1';   // app version, bumped automatically by tools/build.py on every change
const fmt=x=>x===''||x==null||isNaN(x)?'':+(+x).toFixed(2);
const age=t=>{const d=Math.floor((Date.now()-t)/864e5);return d<1?'today':d<60?d+'d ago':Math.round(d/30.4)+'mo ago'};
const dstr=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,4000)};

/* ---------- math ---------- */
const pct=(r,rir)=>1/(1+(r+rir)/30);  // %1RM from reps + RIR
const e1=(w,r,rir)=>w/pct(r,rir);
const hasR=r=>r.rir!==''&&r.rir!=null&&+r.rir>=0&&+r.rir<=10;
const isTest=r=>+r.r===1&&hasR(r)&&+r.rir===0;   // 1 rep at 0 RIR counts as a 1RM
const rnd=(x,i)=>i>0?+(Math.round(x/i)*i).toFixed(3):+(+x).toFixed(2);  // increment 0 = no rounding (bodyweight)
const wt=w=>w>0?fmt(w):'BW';

/* ---------- IndexedDB ---------- */
let db;
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open('liftlog',1);
 r.onupgradeneeded=()=>{const d=r.result,o={keyPath:'id',autoIncrement:true};
  d.createObjectStore('exercises',o);d.createObjectStore('templates',o);
  d.createObjectStore('pr_history',o).createIndex('ex','exId');
  d.createObjectStore('sets',o).createIndex('ex','exId')};
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const st=(n,m='readonly')=>db.transaction(n,m).objectStore(n);
const all=(n,ix,k)=>rq(ix?st(n).index(ix).getAll(k):st(n).getAll()).then(a=>n=='sets'?a.map(s=>s.rir>10?{...s,rir:null}:s):a);  // RIR above 10 is treated as 'not tracked'
const put=(n,o)=>(touch(),rq(st(n,'readwrite').put(o)));
const del=(n,id)=>(touch(),rq(st(n,'readwrite').delete(id)));

/* ---------- state ---------- */
let S={tab:'train',view:null,ex:[],tpl:[],pr:{},prl:[],hist:[]},E=null,W=null;
try{W=JSON.parse(localStorage.getItem('w')||'null')}catch{}
const saveW=()=>{try{localStorage.setItem('w',JSON.stringify(W))}catch{}};
const EX=id=>S.ex.find(e=>e.id==id);
async function load(){
 S.ex=await all('exercises');S.tpl=await all('templates');S.sets=await all('sets');S.pr={};
 S.tpl.forEach(t=>{if(!t.weeks)t.weeks=8;if(!t.days){t.days=[{name:'Day 1',items:t.items||[]}];delete t.items}});
 (await all('pr_history')).sort((a,b)=>a.t-b.t).forEach(p=>S.pr[p.exId]=p)}  // latest tested PR per exercise

/* ---------- %1RM template lines: "3*80%x5" = 3 sets of 5 reps at 80% of tested 1RM ---------- */
function parse(line){line=line.trim();if(!line)return[];
 const m=line.match(/^(?:(\d+)\s*[*×]\s*)?(\d+(?:\.\d+)?)%\s*x\s*(\d+)$/i);
 return m?Array(+(m[1]||1)).fill({pct:m[2]/100,r:+m[3]}):null}
const solve=(o,pr,ex)=>({w:pr?rnd(o.pct*pr.w,ex.inc):'',r:o.r,rir:''});

/* ---------- RIR double progression ---------- */
// Per set, from the same set last session: reps you could have done at target RIR = reps + RIR - target.
// Aim one more rep at the same weight; past the top of the range, reset to the bottom reps at a heavier e1RM-based weight.
/* ---------- suggestions ----------
 Strength = estimated 1RM averaged over your last 4 sessions (recent ones count more), from working sets only:
 not warm-ups, RIR known and under 5. Sets in a rep range close to today's target are preferred, so a heavy-triple
 day doesn't inflate a light-day suggestion. Weight and reps then come from that strength number and the target. */
const isWork=s=>!s.wu&&s.rir!=null&&s.rir<5&&s.w>0;
function strength(ss,lo,hi){
 const est=f=>{const by=new Map();for(const s of ss)if(isWork(s)&&f(s))by.set(s.sess,Math.max(by.get(s.sess)||0,e1(s.w,s.r,s.rir)));
  const v=[...by.values()].slice(-4);if(!v.length)return null;let a=0,b=0;v.forEach((x,i)=>{const k=i+1;a+=x*k;b+=k});return a/b};
 return est(s=>s.r>=lo-3&&s.r<=hi+3)??est(()=>true)}
const RAMP={1:[[.6,5]],2:[[.5,8],[.75,4]],3:[[.45,8],[.65,5],[.85,3]],4:[[.4,8],[.55,5],[.7,3],[.85,2]]};   // warm-up % of working weight, reps
async function suggest(ex,n){
 const ss=(await all('sets','ex',ex.id)).filter(s=>!s.wu).sort((a,b)=>a.t-b.t),rows=[],aim=`${ex.lo}–${ex.hi} reps @ ${ex.rir} RIR`,
  sess=[...new Set(ss.map(s=>s.sess))],fat=j=>Math.floor(j/2);   // later sets: about 1 rep fewer every 2 sets
 const lastS=ss.filter(s=>s.sess==sess[sess.length-1]),hint=lastS.length?`Last: ${lastS.map(s=>`${wt(s.w)}×${s.r}${s.rir!=null?' @'+fmt(s.rir):''}`).join(', ')} · ${aim}`:`${aim} · no history yet`;
 if(!(ex.inc>0)||(lastS.length&&Math.max(...lastS.map(s=>s.w))===0)){   // bodyweight (or done at bodyweight last time): progress reps
  const by=new Map();for(const s of ss)if(!s.wu&&s.rir!=null&&s.rir<5&&(!(ex.inc>0)||s.w===0))by.set(s.sess,Math.max(by.get(s.sess)||0,s.r+s.rir));
  const v=[...by.values()].slice(-4);let cap=null;if(v.length){let a=0,b=0;v.forEach((x,i)=>{a+=x*(i+1);b+=i+1});cap=a/b}
  const lb=lastS.filter(s=>s.rir!=null&&s.rir<5).reduce((m,s)=>Math.max(m,s.r+s.rir),0),
   w=lastS.length?Math.max(...lastS.map(s=>s.w)):'',rS=cap==null?null:Math.round(cap-ex.rir),
   r=rS==null?ex.lo:Math.max(ex.lo,lb?Math.min(rS+2,Math.max(rS,Math.round(lb-ex.rir)+1)):rS+1);
  for(let j=0;j<n;j++)rows.push({w:w||'',r:Math.max(ex.lo,r-fat(j)),rir:ex.rir});return{rows,hint}}
 const E=strength(ss,ex.lo,ex.hi);
 if(!E){for(let j=0;j<n;j++)rows.push({w:'',r:ex.lo,rir:ex.rir});return{rows,hint}}
 let Wb=null,bt=null;   // the weight you last used in today's rep range, and that set
 for(let k=sess.length-1;k>=0&&Wb==null;k--){const t=ss.filter(s=>s.sess==sess[k]&&isWork(s)&&s.r>=ex.lo&&s.r<=ex.hi).sort((a,b)=>b.w-a.w||b.r-a.r)[0];if(t){Wb=t.w;bt=t}}
 let w,r;
 if(Wb!=null){const rS=Math.round(30*(E/Wb-1)-ex.rir);   // reps the averaged strength says you can do at that weight

  if(r>ex.hi){r=ex.lo;w=Math.max(rnd(E*pct(ex.lo,ex.rir),ex.inc),rnd(Wb+ex.inc,ex.inc))}
  else if(r<ex.lo){r=ex.lo;w=Math.min(rnd(E*pct(ex.lo,ex.rir),ex.inc),rnd(Wb-ex.inc,ex.inc))}}

 `<div class=row><button class="b p" data-a=tplSave>Save</button>${E.id?'<button class=b data-a=tplDel>Delete</button>':''}</div>`}

let popping=false;

// The bottom bar is built once and kept; only <main> is redrawn. Rebuilding the bar on every
// render made it flicker on tab changes (the phone repainted it after long pages like History).
let RV='',LY=0;
function render(){
 const v=S.view?.t,body=v=='exd'?rExd():v=='tple'?rTple():{train:rTrain,hist:rHist,tpl:rTpl,ex:rEx}[S.tab]();
 let m=$('main',app),nav=$('nav',app);
 if(!m||!nav){app.innerHTML=`<main></main><nav>${[['train','Train'],['hist','History'],['tpl','Plans'],['ex','Exercises']].map(([k,l])=>`<button data-a=tab data-i=${k}>${NI[k]}${l}</button>`).join('')}</nav>`;m=$('main',app);nav=$('nav',app)}
 m.removeAttribute('style');m.className='';
 if(SL){void m.offsetWidth;m.className='sl'+(SL>0?'r':'l')}   // restart the slide-in animation
 const vk=S.view?S.view.t:'',open=vk&&!RV,close=!vk&&RV;if(open)LY=m.scrollTop;
 m.innerHTML=body;

const TABS=['train','hist','tpl','ex'],TN={train:'Train',hist:'History',tpl:'Plans',ex:'Exercises'};

document.addEventListener('touchstart',e=>{sm=0;if(e.touches.length!=1||S.view||e.target.closest('input,textarea,select,nav,[data-noswipe]'))return;

 const k=Math.min(1,Math.abs(dx)/TH);sd=ok?dx:0;

 document.querySelectorAll('nav button').forEach((x,n)=>x.classList.toggle('nx',ok&&n==j&&k>=1));
 const h=hint();if(ok){h.textContent=(dx<0?'':'‹ ')+TN[TABS[j]]+(dx<0?' ›':'');h.className=(dx<0?'r ':'l ')+(k>=1?'go':'');h.style.opacity=Math.min(1,k*1.4)}else h.style.opacity=0},{passive:true});
document.addEventListener('touchend',e=>{if(sm!=2){sm=0;return}const dx=sd,i=TABS.indexOf(S.tab),j=i+(dx<0?1:-1);
 if(Math.abs(dx)>=TH&&j>=0&&j<TABS.length){$('#sh')?.remove();sm=0;SL=dx<0?1:-1;A.tab(null,{i:TABS[j]})}else swEnd()},{passive:true});

/* ---------- backup ---------- */
const STORES=['exercises','templates','pr_history','sets'];
async function exportData(){const d={app:'liftlog',v:1,t:Date.now()};for(const n of STORES)d[n]=await all(n);
 const name=`liftlog-${new Date().toISOString().slice(0,10)}.json`,f=new File([JSON.stringify(d)],name,{type:'application/json'});
 try{if(navigator.canShare?.({files:[f]}))await navigator.share({files:[f]});else throw 0}
 catch(e){if(e&&e.name=='AbortError')return;const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;a.click()}
 try{localStorage.setItem('lb',Date.now())}catch{}toast('Backup exported');render()}
/* ---------- import validation: rebuild every record from known fields only ---------- */
function clean(d){
 const num=(x,k)=>{if(typeof x!='number'||!isFinite(x))throw new Error('bad '+k);return x},
  opt=x=>typeof x=='number'&&isFinite(x)?x:undefined,
  str=(x,k)=>{if(typeof x!='string'||x.length>200)throw new Error('bad '+k);return x},
  arr=(o,n,max=2e5)=>{if(!Array.isArray(o[n])||o[n].length>max)throw new Error('bad '+n);return o[n]};
 return{t:opt(d.t)??Date.now(),
  exercises:arr(d,'exercises').map(e=>{if(!['rir','pct'].includes(e.mode))throw new Error('bad mode');
   return{id:num(e.id,'id'),name:str(e.name,'name'),mode:e.mode,inc:num(e.inc,'inc'),lo:opt(e.lo),hi:opt(e.hi),rir:opt(e.rir),pb:opt(e.pb),wu:opt(e.wu)}}),
  templates:arr(d,'templates').map(t=>({id:num(t.id,'id'),name:str(t.name,'name'),weeks:opt(t.weeks),active:t.active===true,runStart:opt(t.runStart),days:arr(Array.isArray(t.days)?t:{days:[{name:'Day 1',items:t.items}]},'days',14).map(y=>({name:str(y.name,'name'),items:arr(y,'items',200).map(i=>({exId:num(i.exId,'exId'),n:opt(i.n),lo:opt(i.lo),hi:opt(i.hi),rir:opt(i.rir),text:typeof i.text=='string'?i.text.slice(0,2000):''}))}))})),
  pr_history:arr(d,'pr_history').map(p=>({id:num(p.id,'id'),exId:num(p.exId,'exId'),w:num(p.w,'w'),t:num(p.t,'t'),setId:opt(p.setId)})),
  sets:arr(d,'sets').map(s=>({id:num(s.id,'id'),exId:num(s.exId,'exId'),sess:num(s.sess,'sess'),t:num(s.t,'t'),w:num(s.w,'w'),r:num(s.r,'r'),rir:s.rir==null?null:num(s.rir,'rir'),test:s.test===true,wu:s.wu===true?true:undefined,wn:typeof s.wn=='string'?s.wn.slice(0,100):undefined,pd:typeof s.pd=='string'&&/^\d+:\d+$/.test(s.pd)?s.pd:undefined}))}}
async function importData(f){if(!f)return;let d;
 try{d=JSON.parse(await f.text());if(d.app!='liftlog'||!STORES.every(n=>Array.isArray(d[n])))throw 0}catch{return toast('Not a Lift Log backup file')}
 await applyBackup(d)}
async function applyBackup(d){
 try{d=clean(d)}catch(e){toast('Backup file is invalid ('+e.message+'). Nothing was changed.');return false}
 if(!confirm(`Replace ALL current data with the backup from ${dstr(d.t)}? (${d.sets.length} sets, ${d.exercises.length} exercises)`))return false;
 for(const n of STORES){await rq(st(n,'readwrite').clear());for(const o of d[n])await put(n,o)}
 W=null;saveW();S.view=null;E=null;await load();render();toast('Backup restored');return true}

/* ---------- automatic backup to a private GitHub repo ---------- */
let bt;const ls=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
const lg=k=>{try{return localStorage.getItem(k)}catch{return null}};
const ghCfg=()=>{try{return JSON.parse(lg('gh')||'null')}catch{return null}};
const ghUrl=g=>`https://api.github.com/repos/${g.repo}/contents/liftlog-backup.json`;
const ghH=(g,a='application/vnd.github+json')=>({Authorization:'Bearer '+g.token,Accept:a});
function touch(){ls('dirty','1');clearTimeout(bt);bt=setTimeout(autoBackup,15000)}
let pq=Promise.resolve();
const ghPush=g=>pq=pq.catch(()=>{}).then(async()=>{try{return await ghPush1(g)}catch(e){if(/ 409| 422/.test(e.message))return await ghPush1(g);throw e}});
async function ghPush1(g){let sha;const r0=await fetch(ghUrl(g),{headers:ghH(g),cache:'no-store'});
 if(r0.ok)sha=(await r0.json()).sha;else if(r0.status!=404)throw new Error('GitHub error '+r0.status);
 const d={app:'liftlog',v:1,t:Date.now()};for(const n of STORES)d[n]=await all(n);
 const r=await fetch(ghUrl(g),{method:'PUT',cache:'no-store',headers:ghH(g),body:JSON.stringify({message:'Lift Log backup',content:btoa(unescape(encodeURIComponent(JSON.stringify(d)))),sha})});
 if(!r.ok)throw new Error('GitHub error '+r.status+(r.status==422?' (stale file version, try again)':''));
 ls('lb',Date.now());ls('dirty','0');ls('gherr','')}
async function ghPull(g){const r=await fetch(ghUrl(g),{headers:ghH(g,'application/vnd.github.raw+json'),cache:'no-store'});
 if(r.status==404)return null;if(!r.ok)throw new Error('GitHub error '+r.status);return JSON.parse(await r.text())}
async function autoBackup(){const g=ghCfg();if(!g||!navigator.onLine||(!S.ex.length&&!S.sets.length))return;
 try{await ghPush(g)}catch(e){ls('gherr','Last automatic backup failed: '+e.message)}
 if(S.tab=='ex'&&!S.view)render()}
const DEFREPO='Germani144/lift-log-data';
function ghCard(){const g=ghCfg(),lb=lastBackup(),er=lg('gherr');
 return`<div class=card><b>Automatic backup (GitHub)</b>`+(g?
 `<div class=m>On → ${esc(g.repo)}. Saves a few seconds after each change${lb?'. Last backup '+age(lb):''}.</div>${er?`<div class=wr>${esc(er)}</div>`:''}<div class=row><button class=b data-a=ghNow>Back up now</button><button class=b data-a=ghRestore>Restore</button><button class=b data-a=ghOff>Turn off</button></div>`
 :`<div class=m>Use a <b>private</b> repo just for backups and a fine-grained token limited to that repo with Contents: read and write. Don't use your Pages repo.</div><form id=ghf><input name=username autocomplete=username value="${esc(DEFREPO)}" hidden><label>Repo<input id=ghr value="${esc(DEFREPO)}" autocapitalize=off></label><label>Token<input id=ght name=password type=password autocomplete=current-password></label><button class="b p" type=submit>Turn on</button></form>`)+`</div>`}
Object.assign(A,{
 ghSave:async()=>{const repo=$('#ghr').value.trim(),token=$('#ght').value.trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)||!token)return toast('Enter the repo as owner/name and a token');
  const g={repo,token};
  try{const empty=!S.ex.length&&!S.sets.length,rem=empty?await ghPull(g):null;
   ls('gh',JSON.stringify(g));
   if(rem)await applyBackup(rem);else if(!empty)await ghPush(g);
   toast('Automatic backup is on');render()}
  catch(e){toast(e.message+'. Check the repo name and token permissions.')}},
 ghNow:async()=>{try{await ghPush(ghCfg());toast('Backed up')}catch(e){ls('gherr','Last automatic backup failed: '+e.message);toast(e.message)}render()},
 ghRestore:async()=>{try{const d=await ghPull(ghCfg());d?await applyBackup(d):toast('No backup found in that repo')}catch(e){toast(e.message)}},
 ghOff:()=>{ls('gh','');render()}});
