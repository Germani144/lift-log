<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-BVBquwDNkNNU+NyosS2CETpaToVsBlocmWc44hA3qKc='; style-src 'unsafe-inline'; img-src data:; manifest-src blob:; connect-src https://api.github.com; worker-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#14171a">
<title>Lift Log</title>
<style>
:root{--bg:#eef0f2;--fg:#15191d;--m:#667079;--c:#fff;--bd:#d4d9de;--ac:#1f4fd8;--on:#fff;--wr:#c8340b}
@media(prefers-color-scheme:dark){:root{--bg:#14171a;--fg:#e8ebee;--m:#8b959e;--c:#1d2227;--bd:#2c343b;--ac:#7aa2ff;--on:#0b1220;--wr:#ff8a5c}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top)}
main{padding:12px 12px 90px;max-width:560px;margin:auto}
h2{margin:8px 0 12px;font-size:22px}
.m{color:var(--m);font-size:13px}.wr{color:var(--wr);font-weight:600}
.hd,.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.row>*{flex:1}
.card{background:var(--c);border:1px solid var(--bd);border-radius:10px;padding:10px;margin:10px 0}
button,input,select,textarea{font:inherit;color:inherit}
.b{background:var(--c);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;margin:4px 0;cursor:pointer}
.b.p{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}
.b.big{display:block;width:100%;text-align:left;font-weight:600}
.b small{display:block;font-weight:400;color:var(--m);font-size:13px}
input,select,textarea{width:100%;padding:10px;background:var(--bg);border:1px solid var(--bd);border-radius:8px}
input[type=checkbox]{width:auto}
label{display:block;font-size:13px;color:var(--m);margin:6px 0}
.set{display:grid;grid-template-columns:34px minmax(0,1.5fr) 34px minmax(0,1fr) minmax(0,1fr) 44px;gap:4px;align-items:center;margin:8px 0;font-variant-numeric:tabular-nums}
.set input{text-align:center;padding:10px 2px}
.set.dn{opacity:.55}
.s{height:40px;border:1px solid var(--bd);background:var(--c);border-radius:8px;cursor:pointer}
.ck{height:40px;border-radius:20px;border:2px solid var(--ac);background:none;color:var(--ac);font-size:18px;cursor:pointer}
.ck.on{background:var(--ac);color:var(--on)}
.inf{grid-column:1/-1;font-size:12px;color:var(--m);display:flex;justify-content:space-between;align-items:center;min-height:16px}
.inf label{margin:0;display:flex;gap:4px;align-items:center}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--c);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:14px 0;border:0;background:none;font-size:15px;cursor:pointer;color:var(--m)}
nav button.on{color:var(--ac);font-weight:700}
#toast{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));background:var(--fg);color:var(--bg);padding:12px;border-radius:8px;z-index:9}
code{background:var(--bg);padding:1px 4px;border-radius:4px}
.hl{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px solid var(--bd);font-variant-numeric:tabular-nums}
.hl button{border:0;background:none;color:var(--m);cursor:pointer}
</style></head>
<body><div id="app"></div><div id="toast" hidden></div>
<script>
const $=(s,e=document)=>e.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=x=>x===''||x==null||isNaN(x)?'':+(+x).toFixed(2);
const age=t=>{const d=Math.floor((Date.now()-t)/864e5);return d<1?'today':d<60?d+'d ago':Math.round(d/30.4)+'mo ago'};
const dstr=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,4000)};

/* ---------- math ---------- */
const pct=(r,rir)=>1/(1+(r+rir)/30);  // %1RM from reps + RIR
const e1=(w,r,rir)=>w/pct(r,rir);
const hasR=r=>r.rir!==''&&r.rir!=null;
const rnd=(x,i)=>+(Math.round(x/i)*i).toFixed(3);

/* ---------- IndexedDB ---------- */
let db;
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open('liftlog',1);
 r.onupgradeneeded=()=>{const d=r.result,o={keyPath:'id',autoIncrement:true};
  d.createObjectStore('exercises',o);d.createObjectStore('templates',o);
  d.createObjectStore('pr_history',o).createIndex('ex','exId');
  d.createObjectStore('sets',o).createIndex('ex','exId')};
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const st=(n,m='readonly')=>db.transaction(n,m).objectStore(n);
const all=(n,ix,k)=>rq(ix?st(n).index(ix).getAll(k):st(n).getAll());
const put=(n,o)=>(touch(),rq(st(n,'readwrite').put(o)));
const del=(n,id)=>(touch(),rq(st(n,'readwrite').delete(id)));

/* ---------- state ---------- */
let S={tab:'train',view:null,ex:[],tpl:[],pr:{},prl:[],hist:[]},E=null,W=null;
try{W=JSON.parse(localStorage.getItem('w')||'null')}catch{}
const saveW=()=>{try{localStorage.setItem('w',JSON.stringify(W))}catch{}};
const EX=id=>S.ex.find(e=>e.id==id);
async function load(){
 S.ex=await all('exercises');S.tpl=await all('templates');S.sets=await all('sets');S.pr={};
 (await all('pr_history')).sort((a,b)=>a.t-b.t).forEach(p=>S.pr[p.exId]=p)}  // latest tested PR per exercise

/* ---------- %1RM template lines: "3*80%x5" = 3 sets of 5 reps at 80% of tested 1RM ---------- */
function parse(line){line=line.trim();if(!line)return[];
 const m=line.match(/^(?:(\d+)\s*[*×]\s*)?(\d+(?:\.\d+)?)%\s*x\s*(\d+)$/i);
 return m?Array(+(m[1]||1)).fill({pct:m[2]/100,r:+m[3]}):null}
const solve=(o,pr,ex)=>({w:pr?rnd(o.pct*pr.w,ex.inc):'',r:o.r,rir:''});

/* ---------- RIR double progression ---------- */
// Per set, from the same set last session: reps you could have done at target RIR = reps + RIR - target.
// Aim one more rep at the same weight; past the top of the range, reset to the bottom reps at a heavier e1RM-based weight.
async function suggest(ex,n){
 const ss=(await all('sets','ex',ex.id)).filter(s=>s.rir!=null&&!s.test).sort((a,b)=>a.t-b.t),rows=[];
 if(!ss.length){for(let i=0;i<n;i++)rows.push({w:'',r:ex.lo,rir:ex.rir});
  return{rows,hint:`${ex.lo}–${ex.hi} reps @ ${ex.rir} RIR · no history yet`}}
 const last=ss.filter(s=>s.sess==ss[ss.length-1].sess);
 for(let j=0;j<n;j++){const b=last[Math.min(j,last.length-1)];
  const next=Math.round(b.r+b.rir-ex.rir)+1;let w=b.w,r=next;
  if(next>ex.hi||next<ex.lo){r=ex.lo;w=rnd(b.w/pct(b.r,b.rir)*pct(ex.lo,ex.rir),ex.inc);
   if(next>ex.hi&&w<=b.w)w=rnd(b.w+ex.inc,ex.inc)}
  rows.push({w:rnd(w,ex.inc),r,rir:ex.rir})}
 return{rows,hint:`Last: ${last.map(s=>`${fmt(s.w)}×${s.r} @${fmt(s.rir)}`).join(', ')} · ${ex.lo}–${ex.hi} reps @ ${ex.rir} RIR`}}

async function addItem(it){const ex=EX(it.exId);if(!ex)return;
 let rows=[],hint='';const pr=S.pr[ex.id];
 if(ex.mode=='rir'){const g=await suggest(ex,it.n||3);rows=g.rows;hint=g.hint}
 else{for(const l of (it.text||'').split('\n'))for(const o of parse(l)||[])rows.push(solve(o,pr,ex));
  hint=pr?'Weights are % of your tested 1RM':'No tested 1RM yet. Add one in Exercises.'}
 if(!rows.length)rows.push({w:'',r:'',rir:''});
 W.items.push({exId:ex.id,rows,hint})}

async function start(tid){const t=tid?S.tpl.find(x=>x.id==tid):null;
 W={sess:Date.now(),name:t?t.name:'Quick workout',items:[]};
 if(t)for(const it of t.items)await addItem(it);
 saveW();render()}

/* ---------- row info: e1RM + PR check ---------- */
function info(r,ex){const pr=S.pr[ex.id];
 if(!(r.w>0&&r.r>0&&hasR(r)))return{s:'',w:0};
 const e=e1(r.w,r.r,r.rir);let s='e1RM '+fmt(e);
 if(pr&&!(r.test&&r.r==1)){const d=(e/pr.w-1)*100;s+=` · ${d>=0?'+':''}${d.toFixed(1)}% vs PR`;if(d>3)return{s:'⚠ '+s,w:1}}
 return{s,w:0}}
function updInfo(s){const it=W.items[s.dataset.i],x=info(it.rows[s.dataset.j],EX(it.exId)),sp=$('.inf span',s);
 sp.textContent=x.s;sp.className=x.w?'wr':''}

/* ---------- views ---------- */
const opts=id=>S.ex.map(x=>`<option value="${x.id}" ${x.id==id?'selected':''}>${esc(x.name)}</option>`).join('');

function card(it,i){const ex=EX(it.exId);if(!ex)return'';const pr=S.pr[ex.id];
 let h=`<div class=card><div class=hd><b style="flex:1">${esc(ex.name)}</b><span class=m>${pr?`PR ${fmt(pr.w)} · ${age(pr.t)}`:ex.mode=='pct'?'no PR':''}</span><button class=s style="width:40px" data-a=rmx data-i=${i} aria-label="Remove exercise">×</button></div><div class=m>${esc(it.hint||'')}</div>`;
 h+=it.rows.map((r,j)=>{const x=info(r,ex),d=r.done?'disabled':'';
  return`<div class="set ${r.done?'dn':''}" data-i=${i} data-j=${j}>
  <button class=s data-a=step data-d=-1 ${d}>−</button><input data-f=w inputmode=decimal placeholder=kg value="${fmt(r.w)}" ${d}>
  <button class=s data-a=step data-d=1 ${d}>+</button>
  <input data-f=r inputmode=numeric placeholder=reps value="${fmt(r.r)}" ${d}><input data-f=rir inputmode=decimal placeholder=RIR value="${fmt(r.rir)}" ${d}>
  <button class="ck ${r.done?'on':''}" data-a=${r.done?'undo':'log'}>${r.done?'✓':'○'}</button>
  <div class=inf><span class="${x.w?'wr':''}">${x.s}</span><label><input type=checkbox data-f=test ${r.test?'checked':''} ${d}> 1RM test</label></div></div>`}).join('');
 return h+`<button class=b data-a=addset data-i=${i}>+ Set</button></div>`}

function lastBackup(){try{return +localStorage.getItem('lb')||0}catch{return 0}}
function nag(){const lb=lastBackup();
 return S.sets.length&&Date.now()-lb>6048e5?`<div class=card><span class=wr>Back up your data</span><div class=m>${lb?'Last backup '+age(lb):'No backup yet'}. Clearing browser data erases your history.</div><button class=b data-a=backup>Export backup</button></div>`:''}
function rTrain(){
 if(!W)return`<h2>Train</h2>`+nag()+(S.tpl.map(t=>`<button class="b big" data-a=start data-i=${t.id}>${esc(t.name)}<small>${t.items.length} exercises</small></button>`).join('')||'<p class=m>No templates yet. Build one in Templates, or start a quick workout.</p>')+`<button class=b data-a=start>Quick workout</button>`;
 return`<div class=hd><h2>${esc(W.name)}</h2><button class="b p" data-a=finish>Finish</button></div>`+W.items.map(card).join('')+
 (S.ex.length?`<div class=row><select id=sx>${opts()}</select><button class=b data-a=addx>Add exercise</button></div>`:'<p class=m>Create exercises first.</p>')}

function rEx(){return`<h2>Exercises</h2>`+S.ex.map(e=>{const p=S.pr[e.id];
 return`<button class="b big" data-a=exOpen data-i=${e.id}>${esc(e.name)}<small>${e.mode=='pct'?'% of 1RM':'RIR'} · increment ${e.inc}${p?` · PR ${fmt(p.w)} (${age(p.t)})`:''}</small></button>`}).join('')+`<button class="b p" data-a=exNew>New exercise</button>
 ${ghCard()}
 <div class=card><b>Manual backup</b><div class=m>${lastBackup()?'Last backup '+age(lastBackup()):'No backup yet'}. Export saves everything to one file (share it to Drive, iCloud or Files). Import replaces all current data.</div>
 <div class=row><button class=b data-a=backup>Export</button><button class=b data-a=restore>Import</button></div><input type=file id=imp accept=".json,application/json" hidden></div>`}

function sessions(sets){const g={};sets.forEach(s=>(g[s.sess]??=[]).push(s));
 return Object.keys(g).map(k=>{const ss=g[k].sort((a,b)=>a.t-b.t),es=ss.filter(s=>s.rir!=null&&!s.test).map(s=>e1(s.w,s.r,s.rir));
  return{k:+k,t:ss[0].t,ss,vol:ss.reduce((a,s)=>a+s.w*s.r,0),top:ss.reduce((a,b)=>b.w>a.w?b:a),e:es.length?Math.max(...es):null}}).sort((a,b)=>b.k-a.k)}
function spark(l,v){if(v.length<2)return'';const mx=Math.max(...v),mn=Math.min(...v),R=mx-mn||1;
 const pts=v.map((y,i)=>`${(i/(v.length-1)*280+10).toFixed(1)},${(46-(y-mn)/R*40).toFixed(1)}`).join(' ');
 return`<div class=m style="margin-top:8px">${l}: ${fmt(v[0])} → ${fmt(v[v.length-1])}</div><svg viewBox="0 0 300 52" width="100%" height="52"><polyline points="${pts}" fill="none" stroke="var(--ac)" stroke-width="2"/></svg>`}

function rExd(){const e=E,n=k=>`type=number step=any data-n data-b=${k} value="${e[k]??''}"`;
 let h=`<button class=b data-a=back>‹ Back</button><div class=card>
 <label>Name<input data-b=name value="${esc(e.name)}"></label>
 <label>Tracking<select data-b=mode data-rr><option value=rir ${e.mode=='rir'?'selected':''}>RIR + weight + reps (auto-suggest)</option><option value=pct ${e.mode=='pct'?'selected':''}>% of tested 1RM × reps</option></select></label>
 <label>Weight increment<input ${n('inc')}></label>`+
 (e.mode=='rir'?`<div class=row><label>Reps min<input ${n('lo')}></label><label>Reps max<input ${n('hi')}></label><label>Target RIR<input ${n('rir')}></label></div>`:'')+
 `<div class=row><button class="b p" data-a=exSave>Save</button>${e.id?'<button class=b data-a=exDel>Delete</button>':''}</div></div>`;
 if(!e.id)return h;
 h+=`<div class=card><b>Tested 1RM history</b><div class=m>Latest entry is the current PR.</div>`+
 (S.prl.map((p,k)=>`<div class=hl><span>${fmt(p.w)} · ${dstr(p.t)} <span class=m>${age(p.t)}${k==0?' · current':''}</span></span><button data-a=prDel data-i=${p.id}>×</button></div>`).join('')||'<p class=m>None yet.</p>')+
 `<div class=row><input id=prw type=number step=any inputmode=decimal placeholder="Tested 1RM"><input id=prd type=date value="${new Date().toISOString().slice(0,10)}"><button class=b data-a=prAdd>Add PR</button></div></div>`;
 const ses=sessions(S.hist);
 h+=`<div class=card><b>History</b>`+(ses.length?
  `<div class=m>${ses.length} sessions · best e1RM ${fmt(Math.max(0,...ses.map(x=>x.e||0)))||'–'} · heaviest ${fmt(Math.max(...ses.map(x=>x.top.w)))}</div>`+
  spark('Top-set weight',ses.map(x=>x.top.w).reverse())+spark('Volume per session',ses.map(x=>x.vol).reverse())+
  ses.map(x=>`<div class=card style="margin:8px 0"><div class=hd><b>${dstr(x.t)}</b><span class=m>volume ${fmt(x.vol)}</span></div><div class=m>Top set ${fmt(x.top.w)}×${x.top.r}${x.e?` · best e1RM ${fmt(x.e)}`:''}</div>`+
   x.ss.map(s=>`<div class=hl><span>${fmt(s.w)} × ${s.r}${s.rir!=null?` @ ${fmt(s.rir)} RIR`:''}${s.test?' ★test':''}</span><button data-a=sdel data-i=${s.id}>×</button></div>`).join('')+`</div>`).join('')
  :'<p class=m>No sets logged.</p>')+`</div>`;
 return h}

function rHist(){const g={};S.sets.forEach(s=>(g[s.sess]??=[]).push(s));
 const ks=Object.keys(g).sort((a,b)=>b-a),V=a=>a.reduce((t,x)=>t+x.w*x.r,0);
 return`<h2>History</h2><p class=m>Sets read weight × reps @ RIR. Volume = weight × reps.</p>`+(ks.map(k=>{const ss=g[k].sort((a,b)=>a.t-b.t),ids=[...new Set(ss.map(s=>s.exId))];
  return`<div class=card><div class=hd><b>${esc(ss[0].wn||'Workout')}</b><span class=m>${dstr(+k)} · vol ${fmt(V(ss))}</span></div>`+
  ids.map(id=>{const xs=ss.filter(s=>s.exId==id);return`<div class=hl style="display:block"><div class=hd><b>${esc(EX(id)?.name||'Deleted exercise')}</b><span class=m>vol ${fmt(V(xs))}</span></div><div class=m>${xs.map(s=>`${fmt(s.w)}×${s.r}${s.rir!=null?' @'+fmt(s.rir):''}${s.test?' ★':''}`).join(' · ')}</div></div>`}).join('')+
  `<button class=b data-a=wdel data-i=${k}>Delete workout</button></div>`}).join('')||'<p class=m>No workouts logged yet. Sets appear here as soon as you tap ○.</p>')}

function rTpl(){return`<h2>Templates</h2>`+S.tpl.map(t=>`<button class="b big" data-a=tplEdit data-i=${t.id}>${esc(t.name)}<small>${t.items.map(i=>esc(EX(i.exId)?.name||'?')).join(', ')}</small></button>`).join('')+`<button class="b p" data-a=tplNew>New template</button>`}

function rTple(){return`<button class=b data-a=back>‹ Back</button><label>Template name<input data-b=name value="${esc(E.name)}"></label>
 <p class=m>For % of 1RM exercises, write one line per group of sets: <code>3*80%x5</code> = 3 sets of 5 reps at 80% of your tested 1RM. Leave off the <code>3*</code> for a single set. RIR exercises just need a set count.</p>`+
 E.items.map((it,k)=>{const ex=EX(it.exId);
  return`<div class=card><div class=row><select data-b="items.${k}.exId" data-n data-rr>${opts(it.exId)}</select><button class=s style="flex:0 0 40px" data-a=tplDelItem data-i=${k}>×</button></div>`+
  (ex&&ex.mode=='pct'?`<label>Sets<textarea rows=3 data-b="items.${k}.text" placeholder="3*80%x5&#10;2*85%x3">${esc(it.text)}</textarea></label>`:`<label>Sets<input type=number data-n data-b="items.${k}.n" value="${it.n??''}"></label>`)+`</div>`}).join('')+
 `<button class=b data-a=tplAdd>Add exercise</button><div class=row><button class="b p" data-a=tplSave>Save</button>${E.id?'<button class=b data-a=tplDel>Delete</button>':''}</div>`}

function render(){
 const v=S.view?.t,body=v=='exd'?rExd():v=='tple'?rTple():{train:rTrain,hist:rHist,tpl:rTpl,ex:rEx}[S.tab]();
 app.innerHTML=`<main>${body}</main><nav>${[['train','Train'],['hist','History'],['tpl','Templates'],['ex','Exercises']].map(([k,l])=>`<button class="${S.tab==k?'on':''}" data-a=tab data-i=${k}>${l}</button>`).join('')}</nav>`}

/* ---------- events ---------- */
const setPath=(o,p,v)=>{const k=p.split('.'),l=k.pop();k.forEach(x=>o=o[x]);o[l]=v};
app.addEventListener('input',e=>{const t=e.target,s=t.closest('.set');
 if(s&&t.dataset.f){const r=W.items[s.dataset.i].rows[s.dataset.j],f=t.dataset.f;
  r[f]=f=='test'?t.checked:t.value===''?'':+t.value;saveW();updInfo(s)}
 else if(t.dataset.b&&E)setPath(E,t.dataset.b,t.dataset.n!=null?(t.value===''?'':+t.value):t.value)});
app.addEventListener('change',e=>{if(e.target.id=='imp')importData(e.target.files[0]);else if(e.target.dataset.rr!=null)render()});
app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)A[b.dataset.a]?.(b.closest('.set'),b.dataset)});

async function loadEx(id){S.prl=(await all('pr_history','ex',id)).sort((a,b)=>b.t-a.t);
 S.hist=(await all('sets','ex',id)).sort((a,b)=>b.t-a.t);await load();render()}
const back=()=>{S.view=null;E=null;render()};

const A={
 backup:()=>exportData(),
 restore:()=>$('#imp').click(),
 tab:async(s,d)=>{S.tab=d.i;S.view=null;E=null;await load();render()},
 back,
 start:(s,d)=>start(+d.i||null),
 finish:()=>{if(confirm('Finish workout?')){W=null;saveW();render()}},
 addx:async()=>{await addItem({exId:+$('#sx').value,n:3});saveW();render()},
 rmx:async(s,d)=>{const it=W.items[d.i],done=it.rows.filter(x=>x.done);
  if(!confirm(done.length?`Remove ${EX(it.exId)?.name||'this exercise'} and delete its ${done.length} logged set(s) from this workout?`:'Remove this exercise from the workout?'))return;
  for(const x of done)if(x.id)await del('sets',x.id);
  W.items.splice(+d.i,1);saveW();render()},
 addset:(s,d)=>{const rows=W.items[d.i].rows,l=rows[rows.length-1]||{};rows.push({w:l.w??'',r:l.r??'',p:l.p??''});saveW();render()},
 step:(s,d)=>{const it=W.items[s.dataset.i],r=it.rows[s.dataset.j];
  r.w=Math.max(0,rnd((+r.w||0)+ +d.d*EX(it.exId).inc,.001));$('[data-f=w]',s).value=fmt(r.w);saveW();updInfo(s)},
 log:async s=>{const it=W.items[s.dataset.i],r=it.rows[s.dataset.j],ex=EX(it.exId);
  if(!(r.w>0&&r.r>0))return toast('Enter weight and reps');
  if(r.test&&r.r!=1)return toast('A 1RM test must be a single (1 rep).');
  const rec={exId:ex.id,sess:W.sess,wn:W.name,t:Date.now(),w:r.w,r:r.r,rir:hasR(r)?r.rir:null,test:!!r.test};
  r.id=await put('sets',rec);r.done=true;saveW();
  const x=info(r,ex),pr=S.pr[ex.id];
  if(r.test){if(confirm(`Save ${fmt(r.w)} as new PR for ${ex.name}?`+(pr?`\nCurrent: ${fmt(pr.w)} (tested ${age(pr.t)})`:''))){
    await put('pr_history',{exId:ex.id,w:r.w,t:rec.t,setId:r.id});await load()}}
  else if(x.w)toast(`${x.s}. This e1RM is over 3% above your PR. Consider testing a new max.`);
  render()},
 undo:async s=>{const r=W.items[s.dataset.i].rows[s.dataset.j];if(r.id)await del('sets',r.id);r.done=false;delete r.id;saveW();render()},
 exNew:()=>{E={name:'',mode:'rir',inc:2.5,lo:8,hi:12,rir:2};S.prl=[];S.hist=[];S.view={t:'exd'};render()},
 exOpen:async(s,d)=>{E=structuredClone(EX(+d.i));S.view={t:'exd'};await loadEx(E.id)},
 exSave:async()=>{if(!E.name.trim())return toast('Name required');if(!(E.inc>0))return toast('Increment must be above 0');
  if(E.mode=='rir'){E.lo||=8;E.hi||=Math.max(E.lo,12);E.rir??=2;if(E.hi<E.lo)return toast('Reps max must be at least reps min')}
  await put('exercises',E);await load();back()},
 exDel:async()=>{if(!confirm('Delete exercise with its PRs and set history?'))return;
  for(const s of await all('sets','ex',E.id))await del('sets',s.id);
  for(const p of await all('pr_history','ex',E.id))await del('pr_history',p.id);
  await del('exercises',E.id);await load();back()},
 prAdd:async()=>{const w=+$('#prw').value,d=$('#prd').value;if(!(w>0))return toast('Enter the tested weight');
  await put('pr_history',{exId:E.id,w,t:new Date(d+'T12:00').getTime()});await loadEx(E.id)},
 prDel:async(s,d)=>{await del('pr_history',+d.i);await loadEx(E.id)},
 wdel:async(s,d)=>{if(!confirm('Delete this workout?'))return;for(const x of S.sets.filter(x=>x.sess==d.i))await del('sets',x.id);await load();render()},
 sdel:async(s,d)=>{await del('sets',+d.i);await loadEx(E.id)},
 tplNew:()=>{E={name:'',items:[]};S.view={t:'tple'};render()},

  for(const it of E.items){const ex=EX(it.exId);if(ex?.mode=='pct')for(const l of (it.text||'').split('\n'))

  await put('templates',E);await load();back()},

/* ---------- backup ---------- */
const STORES=['exercises','templates','pr_history','sets'];
async function exportData(){const d={app:'liftlog',v:1,t:Date.now()};for(const n of STORES)d[n]=await all(n);
 const name=`liftlog-${new Date().toISOString().slice(0,10)}.json`,f=new File([JSON.stringify(d)],name,{type:'application/json'});
 try{if(navigator.canShare?.({files:[f]}))await navigator.share({files:[f]});else throw 0}
 catch(e){if(e&&e.name=='AbortError')return;const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;a.click()}
 try{localStorage.setItem('lb',Date.now())}catch{}toast('Backup exported');render()}
/* ---------- import validation: rebuild every record from known fields only ---------- */
function clean(d){
 const num=(x,k)=>{if(typeof x!='number'||!isFinite(x))throw new Error('bad '+k);return x},
  opt=x=>typeof x=='number'&&isFinite(x)?x:undefined,
  str=(x,k)=>{if(typeof x!='string'||x.length>200)throw new Error('bad '+k);return x},
  arr=(o,n,max=2e5)=>{if(!Array.isArray(o[n])||o[n].length>max)throw new Error('bad '+n);return o[n]};
 return{t:opt(d.t)??Date.now(),
  exercises:arr(d,'exercises').map(e=>{if(!['rir','pct'].includes(e.mode))throw new Error('bad mode');
   return{id:num(e.id,'id'),name:str(e.name,'name'),mode:e.mode,inc:num(e.inc,'inc'),lo:opt(e.lo),hi:opt(e.hi),rir:opt(e.rir)}}),
  templates:arr(d,'templates').map(t=>({id:num(t.id,'id'),name:str(t.name,'name'),items:arr(t,'items',200).map(i=>({exId:num(i.exId,'exId'),n:opt(i.n),text:typeof i.text=='string'?i.text.slice(0,2000):''}))})),
  pr_history:arr(d,'pr_history').map(p=>({id:num(p.id,'id'),exId:num(p.exId,'exId'),w:num(p.w,'w'),t:num(p.t,'t'),setId:opt(p.setId)})),
  sets:arr(d,'sets').map(s=>({id:num(s.id,'id'),exId:num(s.exId,'exId'),sess:num(s.sess,'sess'),t:num(s.t,'t'),w:num(s.w,'w'),r:num(s.r,'r'),rir:s.rir==null?null:num(s.rir,'rir'),test:s.test===true,wn:typeof s.wn=='string'?s.wn.slice(0,100):undefined}))}}
async function importData(f){if(!f)return;let d;
 try{d=JSON.parse(await f.text());if(d.app!='liftlog'||!STORES.every(n=>Array.isArray(d[n])))throw 0}catch{return toast('Not a Lift Log backup file')}
 await applyBackup(d)}
async function applyBackup(d){
 try{d=clean(d)}catch(e){toast('Backup file is invalid ('+e.message+'). Nothing was changed.');return false}
 if(!confirm(`Replace ALL current data with the backup from ${dstr(d.t)}? (${d.sets.length} sets, ${d.exercises.length} exercises)`))return false;
 for(const n of STORES){await rq(st(n,'readwrite').clear());for(const o of d[n])await put(n,o)}
 W=null;saveW();S.view=null;E=null;await load();render();toast('Backup restored');return true}

/* ---------- automatic backup to a private GitHub repo ---------- */
let bt;const ls=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
const lg=k=>{try{return localStorage.getItem(k)}catch{return null}};
const ghCfg=()=>{try{return JSON.parse(lg('gh')||'null')}catch{return null}};
const ghUrl=g=>`https://api.github.com/repos/${g.repo}/contents/liftlog-backup.json`;
const ghH=(g,a='application/vnd.github+json')=>({Authorization:'Bearer '+g.token,Accept:a});
function touch(){ls('dirty','1');clearTimeout(bt);bt=setTimeout(autoBackup,15000)}
async function ghPush(g){let sha;const r0=await fetch(ghUrl(g),{headers:ghH(g)});
 if(r0.ok)sha=(await r0.json()).sha;else if(r0.status!=404)throw new Error('GitHub error '+r0.status);
 const d={app:'liftlog',v:1,t:Date.now()};for(const n of STORES)d[n]=await all(n);
 const r=await fetch(ghUrl(g),{method:'PUT',headers:ghH(g),body:JSON.stringify({message:'Lift Log backup',content:btoa(unescape(encodeURIComponent(JSON.stringify(d)))),sha})});
 if(!r.ok)throw new Error('GitHub error '+r.status);
 ls('lb',Date.now());ls('dirty','0');ls('gherr','')}
async function ghPull(g){const r=await fetch(ghUrl(g),{headers:ghH(g,'application/vnd.github.raw+json')});
 if(r.status==404)return null;if(!r.ok)throw new Error('GitHub error '+r.status);return JSON.parse(await r.text())}
async function autoBackup(){const g=ghCfg();if(!g||!navigator.onLine||(!S.ex.length&&!S.sets.length))return;
 try{await ghPush(g)}catch(e){ls('gherr','Last automatic backup failed: '+e.message)}
 if(S.tab=='ex'&&!S.view)render()}
function ghCard(){const g=ghCfg(),lb=lastBackup(),er=lg('gherr');
 return`<div class=card><b>Automatic backup (GitHub)</b>`+(g?
 `<div class=m>On → ${esc(g.repo)}. Saves a few seconds after each change${lb?'. Last backup '+age(lb):''}.</div>${er?`<div class=wr>${esc(er)}</div>`:''}<div class=row><button class=b data-a=ghNow>Back up now</button><button class=b data-a=ghRestore>Restore</button><button class=b data-a=ghOff>Turn off</button></div>`
 :`<div class=m>Use a <b>private</b> repo just for backups and a fine-grained token limited to that repo with Contents: read and write. Don't use your Pages repo.</div><label>Repo<input id=ghr placeholder="your-name/lift-log-data" autocapitalize=off></label><label>Token<input id=ght type=password autocomplete=off></label><button class="b p" data-a=ghSave>Turn on</button>`)+`</div>`}
Object.assign(A,{
 ghSave:async()=>{const repo=$('#ghr').value.trim(),token=$('#ght').value.trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)||!token)return toast('Enter the repo as owner/name and a token');
  const g={repo,token};
  try{const empty=!S.ex.length&&!S.sets.length,rem=empty?await ghPull(g):null;
   ls('gh',JSON.stringify(g));
   if(rem)await applyBackup(rem);else if(!empty)await ghPush(g);
   toast('Automatic backup is on');render()}
  catch(e){toast(e.message+'. Check the repo name and token permissions.')}},
 ghNow:async()=>{try{await ghPush(ghCfg());toast('Backed up')}catch(e){ls('gherr','Last automatic backup failed: '+e.message);toast(e.message)}render()},
 ghRestore:async()=>{try{const d=await ghPull(ghCfg());d?await applyBackup(d):toast('No backup found in that repo')}catch(e){toast(e.message)}},
 ghOff:()=>{ls('gh','');render()}});
addEventListener('online',()=>ghCfg()&&autoBackup());

try{const m={name:'Lift Log',short_name:'Lift Log',display:'standalone',start_url:location.href.split('#')[0],background_color:'#14171a',theme_color:'#14171a',
 icons:[{src:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#1f4fd8"/><rect x="8" y="28" width="48" height="8" fill="#fff"/><rect x="14" y="16" width="8" height="32" fill="#fff"/><rect x="42" y="16" width="8" height="32" fill="#fff"/></svg>'),sizes:'any',type:'image/svg+xml',purpose:'any'}]};

open().then(async d=>{db=d;await load();render();if(ghCfg()&&lg('dirty')!='0')setTimeout(autoBackup,3000)}).catch(e=>{app.innerHTML='<main><p class=wr>IndexedDB is unavailable: '+esc(e.message||e)+'</p></main>'});
