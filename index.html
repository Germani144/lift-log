@keyframes ld{from{background:var(--bd)}to{background:var(--fg)}}

</style></head>
<body><div id="splash" aria-hidden="true"><img src="icon-192.png" width="132" height="132" alt=""><b>Lift Log</b><span id="sver"></span><div class="bb"><i class="pl pb"></i><i class="pl pr"></i><i class="sl"></i><div class="shaft"><i></i><i></i><i></i><i></i><i></i></div><i class="sl"></i><i class="pl pr"></i><i class="pl pb"></i></div></div><div id="app"></div><div id="toast" hidden></div>
<script>
const $=(s,e=document)=>e.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bb=(n,done,cur,label)=>`<div class=bb role=img aria-label="${esc(label)}"><i class="pl pb"></i><i class="pl pr"></i><i class=sl></i><div class=shaft>${Array.from({length:n},(_,i)=>`<i${i<done?' class=d':cur&&i==done?' class=n':''}></i>`).join('')}</div><i class=sl></i><i class="pl pr"></i><i class="pl pb"></i></div>`;
const NI={train:'<svg viewBox="0 0 24 24"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>',hist:'<svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',tpl:'<svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>',ex:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>'};
const scTo=(x,y)=>{const m=$('main');if(m)m.scrollTop=y},scY=()=>$('main')?.scrollTop||0;   // the page scrolls inside <main>, not the window
const VER='2.8';   // app version, bumped automatically by tools/build.py on every change
/* All of Germani144's apps share this origin's localStorage, so every Lift Log key starts with "lift-log:".
   Old unprefixed keys are moved once. Keys whose content proves they're Lift Log's (workout in progress, backup
   settings) are removed afterwards; generic ones (rest, bw, lb, dirty) are copied only if they look valid, and
   left in place because another app might own a key with the same name. */
const LSP='lift-log:';
(()=>{try{const L=localStorage,J=v=>{try{return JSON.parse(v)}catch{return null}},num=(a,b)=>v=>+v>=a&&+v<=b;
 const sure={w:v=>{const o=J(v);return!!(o&&Array.isArray(o.items)&&o.sess>0)},gh:v=>{const o=J(v);return!!(o&&o.token&&/lift-log/i.test(o.repo||''))},gherr:v=>/^Last automatic backup failed/.test(v)},
  looks={rest:num(15,1800),bw:num(20,400),lb:num(1.5e12,4e12),dirty:v=>v=='0'||v=='1'};
 for(const k of [...Object.keys(sure),...Object.keys(looks)]){const v=L.getItem(k);if(v==null||L.getItem(LSP+k)!=null)continue;
  if(sure[k]){if(sure[k](v)){L.setItem(LSP+k,v);L.removeItem(k)}}else if(looks[k](v))L.setItem(LSP+k,v)}}catch{}})();
const fmt=x=>x===''||x==null||isNaN(x)?'':+(+x).toFixed(2);
const age=t=>{const d=Math.floor((Date.now()-t)/864e5);return d<1?'today':d<60?d+'d ago':Math.round(d/30.4)+'mo ago'};
const dstr=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,4000)};

/* ---------- math ---------- */
const pct=(r,rir)=>1/(1+(r+rir)/30);  // %1RM from reps + RIR
const e1=(w,r,rir)=>w/pct(r,rir);
const hasR=r=>r.rir!==''&&r.rir!=null&&+r.rir>=0&&+r.rir<=10;
const isTest=r=>+r.r===1&&hasR(r)&&+r.rir===0;   // 1 rep at 0 RIR counts as a 1RM
const rnd=(x,i)=>i>0?+(Math.round(x/i)*i).toFixed(3):+(+x).toFixed(2);  // increment 0 = no rounding (bodyweight)
const wt=w=>w>0?fmt(w):'BW';

/* ---------- IndexedDB ---------- */
let db;
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open('liftlog',1);
 r.onupgradeneeded=()=>{const d=r.result,o={keyPath:'id',autoIncrement:true};
  d.createObjectStore('exercises',o);d.createObjectStore('templates',o);
  d.createObjectStore('pr_history',o).createIndex('ex','exId');
  d.createObjectStore('sets',o).createIndex('ex','exId')};
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const rq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const st=(n,m='readonly')=>db.transaction(n,m).objectStore(n);
const all=(n,ix,k)=>rq(ix?st(n).index(ix).getAll(k):st(n).getAll()).then(a=>n=='sets'?a.map(s=>s.rir>10?{...s,rir:null}:s):a);  // RIR above 10 is treated as 'not tracked'
const put=(n,o)=>(touch(),rq(st(n,'readwrite').put(o)));
const del=(n,id)=>(touch(),rq(st(n,'readwrite').delete(id)));

/* ---------- state ---------- */
let S={tab:'train',view:null,ex:[],tpl:[],pr:{},prl:[],hist:[]},E=null,W=null;
try{W=JSON.parse(localStorage.getItem(LSP+'w')||'null')}catch{}
const saveW=()=>{try{localStorage.setItem(LSP+'w',JSON.stringify(W))}catch{}};
const EX=id=>S.ex.find(e=>e.id==id);
async function load(){
 S.ex=await all('exercises');S.tpl=await all('templates');S.sets=await all('sets');S.pr={};
 S.tpl.forEach(t=>{if(!t.weeks)t.weeks=8;if(!t.days){t.days=[{name:'Day 1',items:t.items||[]}];delete t.items}
  for(const d of t.days)for(const it of d.items){if(!it.mode)it.mode=EX(it.exId)?.mode=='pct'?'pct':'rir';if(it.mode=='pct'&&!it.lines?.length){it.lines=linesFromText(it.text);if(!it.lines.length)it.lines=[newLine()]}}});
 (await all('pr_history')).sort((a,b)=>a.t-b.t).forEach(p=>S.pr[p.exId]=p)}  // latest tested PR per exercise

/* ---------- plan slots: each one is RIR (sets, rep range, target RIR) or % of 1RM (lines of sets x reps @ % with a target RPE) ---------- */
// Old plans stored % sets as text like "3*80%x5"; turn those into lines once.
function linesFromText(t){const out=[];for(const l of String(t||'').split('\n')){const m=l.trim().match(/^(?:(\d+)\s*[*×]\s*)?(\d+(?:\.\d+)?)%\s*x\s*(\d+)$/i);if(m)out.push({n:+(m[1]||1),p:+m[2],r:+m[3]})}return out}
/* Bodyweight lifts (pull-ups, dips…): with "Load includes bodyweight" on, the maths uses you + the plate,
   while you always type and see only the added kg. Each logged set remembers your bodyweight at the time. */
const BWv=()=>+lg('bw')||0,bwo=ex=>ex?.bwl?BWv():0;
const tot=(ex,s)=>ex?.bwl?{...s,w:(s.w===''||s.w==null?0:+s.w)+(s.bw??BWv())}:s;   // a set in total-load space
const outW=(ex,v)=>{if(ex?.bwl){const a=rnd(+v-BWv(),ex.inc);return a>0?a:''}return v>0?rnd(v,ex.inc):''};   // total load -> what you load ('' = bodyweight / no suggestion)
/* RIR is picked from a list: 0–5 in half steps, plus "5+" (stored as 6). A 5+ set stays in history and volume
   but, like a warm-up, never feeds suggestions, the strength estimate or the next-set adjustment. */
const RIRS=[0,.5,1,1.5,2,2.5,3,3.5,4,4.5,5,6];
const rirTxt=v=>v==null||v===''?'':+v>5?'5+':fmt(v),rpeTxt=v=>v==null||v===''?'':+v>5?'<5':fmt(10-v);
function rirSel(attrs,v,{pct=false,max5=false,blank=true}={}){const cur=v===''||v==null?'':+v,vals=(max5?RIRS.filter(x=>x<=5):RIRS).slice();
 if(cur!==''&&!vals.includes(cur)){vals.push(cur);vals.sort((a,b)=>a-b)}
 return`<select ${attrs} class="pick${cur===''?' ph':''}">${blank?`<option value=""${cur===''?' selected':''}>${pct?'RPE':'RIR'}</option>`:''}${(pct?vals.slice().reverse():vals).map(x=>`<option value="${x}"${x===cur?' selected':''}>${pct?rpeTxt(x):rirTxt(x)}</option>`).join('')}</select>`}
const rememberMode=async(ex,m)=>{if(ex&&ex.mode!=m){ex.mode=m;await put('exercises',ex)}};   // new plan slots and quick adds start in the mode you used last
const newLine=()=>({n:3,r:3,p:75});
// RIR slots: one target RIR per week of the plan.
const rirWeeks=(it,weeks,ex)=>{const a=Array.isArray(it.rirW)?it.rirW.slice(0,weeks):[],d=a.length?a[a.length-1]:(it.rir??ex?.rir??2);while(a.length<weeks)a.push(d);return a};
// How strong a lift has been lately vs. its longer-run level, at a similar rep count: recent 3 sessions vs. the last 10. Used to nudge planned % sets (max ±10%).
function trend(ss,r){const by=new Map();for(const s of ss)if(isWork(s)&&Math.abs(s.r-r)<=1)by.set(s.sess,Math.max(by.get(s.sess)||0,e1(s.w,s.r,s.rir)));
 const v=[...by.values()];if(v.length<2)return 1;const rc=v.slice(-3);let a=0,b=0;rc.forEach((x,i)=>{a+=x*(i+1);b+=i+1});

// Reference 1RM for % view: your tested 1RM, or else the estimate from recent working sets.
async function refFor(ex){const p=S.pr[ex.id];if(p)return{w:p.w+bwo(ex),est:false};

/* ---------- RIR double progression ---------- */
// Per set, from the same set last session: reps you could have done at target RIR = reps + RIR - target.
// Aim one more rep at the same weight; past the top of the range, reset to the bottom reps at a heavier e1RM-based weight.
/* ---------- suggestions ----------

 not warm-ups, RIR known and under 5. Sets in a rep range close to today's target are preferred, so a heavy-triple

const isWork=s=>!s.wu&&s.rir!=null&&s.rir<5&&s.w>0;
function strength(ss,lo,hi){
 const est=f=>{const by=new Map();for(const s of ss)if(isWork(s)&&f(s))by.set(s.sess,Math.max(by.get(s.sess)||0,e1(s.w,s.r,s.rir)));
  const v=[...by.values()].slice(-4);if(!v.length)return null;let a=0,b=0;v.forEach((x,i)=>{const k=i+1;a+=x*k;b+=k});return a/b};

const RAMP={1:[[.6,5]],2:[[.5,8],[.75,4]],3:[[.45,8],[.65,5],[.85,3]],4:[[.4,8],[.55,5],[.7,3],[.85,2]]};   // warm-up % of working weight, reps
async function suggest(ex,n){
 const ss=(await all('sets','ex',ex.id)).filter(s=>!s.wu).sort((a,b)=>a.t-b.t),rows=[],aim=`${ex.lo}–${ex.hi} reps @ ${ex.rir} RIR`,
  sess=[...new Set(ss.map(s=>s.sess))],fat=j=>Math.floor(j/2),   // later sets: about 1 rep fewer every 2 sets
  sT=ex.bwl?ss.map(s=>tot(ex,s)):ss;
 const lastS=ss.filter(s=>s.sess==sess[sess.length-1]),hint=lastS.length?`Last: ${lastS.map(s=>`${wt(s.w)}×${s.r}${s.rir!=null?' @'+rirTxt(s.rir):''}`).join(', ')} · ${aim}`:`${aim} · no history yet`;

 if(!E){for(let j=0;j<n;j++)rows.push({w:'',r:ex.lo,rir:ex.rir});return{rows,hint}}

 for(let k=sess.length-1;k>=0&&Wb==null;k--){const t=sT.filter(s=>s.sess==sess[k]&&isWork(s)&&s.r>=ex.lo&&s.r<=ex.hi).sort((a,b)=>b.w-a.w||b.r-a.r)[0];if(t){Wb=t.w;bt=t}}

  else if(r<ex.lo){r=ex.lo;w=Math.min(rnd(E*pct(ex.lo,ex.rir),ex.inc),rnd(Wb-ex.inc,ex.inc))}}

async function addItem(it,wk=1){const ex=EX(it.exId);if(!ex)return;
 const pk=(a,b)=>a===''||a==null?b:a,mode=it.mode||(ex.mode=='pct'?'pct':'rir'),lo=pk(it.lo,ex.lo)||5,hi=pk(it.hi,ex.hi)||Math.max(lo,8),

  item={exId:ex.id,mode,lo,hi,rirT,rows:[],hint:'',bwo:bwo(ex)},g=await suggest({...ex,lo,hi,rir:rirT},mode=='pct'&&it.lines?.length?0:it.n||3);
 item.hint=g.hint;
 if(mode=='pct'){const ref=await refFor(ex);item.ref=ref?.w;item.refEst=ref?.est}
 if(mode=='pct'&&it.lines?.length){   // planned % sets: the plan's %, nudged (max ±10%) by your recent trend at that rep count
  const ss=(await all('sets','ex',ex.id)).filter(s=>!s.wu).sort((a,b)=>a.t-b.t).map(s=>tot(ex,s));let moved=0;
  for(const l of it.lines){const r=Math.max(1,Math.round(+l.r||1)),f=trend(ss,r),wp=item.ref?(+l.p||0)/100*item.ref:0;if(f!==1)moved=f;
   for(let k=0;k<Math.max(1,Math.round(+l.n||1));k++)item.rows.push({w:wp>0?outW(ex,wp*f):'',r,rir:'',pw:wp,auto:true})}
  const last=(item.hint||'').startsWith('Last:')?item.hint.replace(/ · \d+–\d+ reps @ [\d.]+ RIR$/,''):'';
  item.hint=[moved?`${moved>1?'+':''}${Math.round((moved-1)*100)}% vs plan from recent sessions`:'',last].filter(Boolean).join(' · ')}

 if(nw){const w0=+item.rows[0].w||0;item.rows.unshift(...RAMP[nw].map(([p,r])=>({w:w0&&ex.inc>0?rnd(w0*p,ex.inc):'',r,rir:'',wu:true})))}

/* After you log a set, the sets after it (that you haven't edited) adjust to how that set really went.
   % view: the weight moves to match today's strength. RIR view: the weight stays and the reps move,
   unless they'd leave the rep range. Never more than ±10% from the plan, about 1.5% easier per set for fatigue. */
async function adjustPct(it,j,ex){const d=tot(ex,it.rows[j]);if(+d.rir>5||d.wu||!(+d.w>0)||!hasR(d)||!(+d.r>0)||!(ex.inc>0))return;

 for(const s of (await all('sets','ex',ex.id)).map(s=>tot(ex,s)))if(s.sess!=W.sess&&isWork(s)&&Math.abs(s.r-d.r)<=1)by.set(s.sess,[s.t,Math.max(by.get(s.sess)?.[1]||0,e1(s.w,s.r,s.rir))]);
 let base=null;const v=[...by.values()].sort((a,b)=>a[0]-b[0]).slice(-4).map(x=>x[1]);

 else{const f=it.rows.find(r=>r.done&&!r.wu&&+tot(ex,r).w>0&&hasR(r)&&Math.abs(+r.r-d.r)<=1);if(f&&f!==it.rows[j]){const fT=tot(ex,f);base=e1(+fT.w,+fT.r,+fT.rir)}}   // no history: compare with today's first set

 for(let q=j+1;q<it.rows.length;q++){const r=it.rows[q];if(r.done||r.wu||!r.auto||!(+r.r>0)||!hasR(r))continue;
  const f=Math.pow(.985,++k),pw=+r.pw||+r.w||0,cl=w=>pw>0?Math.min(rnd(pw*1.1,ex.inc),Math.max(rnd(pw*.9,ex.inc),w)):w;

  else{rr=Math.round(30*(e*f/w-1)-(+r.rir));
   if(rr>it.hi){rr=it.hi;w=cl(rnd(e*f*pct(rr,+r.rir),ex.inc))}else if(rr<it.lo){rr=it.lo;w=cl(rnd(e*f*pct(rr,+r.rir),ex.inc))}}
  if(rr!==+r.r||w!==w0){r.r=rr;if(w!==w0)r.w=outW(ex,w);r.adj=true}}}

async function start(tid,day=0){PICK=null;LAND=false;const t=tid?S.tpl.find(x=>x.id==tid):null,dy=t&&t.days[day];

function lastBackup(){try{return +localStorage.getItem(LSP+'lb')||0}catch{return 0}}

/* ---------- rest timer ---------- */
let AC,alarmedFor=0;
const fmtT=x=>Math.floor(x/60)+':'+String(x%60).padStart(2,'0');
function restText(){const rem=W.restEnd?W.restEnd-Date.now():0;return W.restEnd&&rem<=0?'Go!':fmtT(W.restEnd?Math.ceil(rem/1000):W.rest)}
function restCls(){return'rt'+(W.restEnd?(W.restEnd-Date.now()>0?' run':' go'):'')}
const rbw=()=>{const rem=W.restEnd?W.restEnd-Date.now():0;return rem>0?Math.min(100,rem/(W.rest*1000)*100).toFixed(1)+'%':'0%'};
const elapsed=()=>{const x=Math.floor((Date.now()-W.sess)/1000);return x>=0&&x<21600?fmtT(x):''};

function exMatches(q,skip){const u={};for(const x of S.sets)u[x.exId]=(u[x.exId]||0)+1;

function sessions(sets){const g={};sets.forEach(s=>(g[s.sess]??=[]).push(s));
 return Object.keys(g).map(k=>{const ss=g[k].sort((a,b)=>a.t-b.t),es=ss.filter(s=>s.rir!=null&&!s.test).map(s=>e1(s.w,s.r,s.rir));
  return{k:+k,t:ss[0].t,ss,vol:ss.reduce((a,s)=>a+s.r,0),top:ss.reduce((a,b)=>b.w>a.w?b:a),e:es.length?Math.max(...es):null}}).sort((a,b)=>b.k-a.k)}
function chart(l,v,t,z,u=''){if(v.length<2)return'';const mx=Math.max(...v),mn=z?0:Math.min(...v),R=mx-mn||1,L=34,Rr=292,T=8,B=100,
 X=i=>(L+i/(v.length-1)*(Rr-L)).toFixed(1),Y=y=>(B-(y-mn)/R*(B-T)).toFixed(1),
 pts=v.map((y,i)=>X(i)+','+Y(y)).join(' '),d=x=>new Date(x).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'2-digit'});
 return`<div class=m style="margin-top:12px">${l}</div><svg class=chart viewBox="0 0 300 124" width="100%" role=img aria-label="${l}: from ${fmt(v[0])} to ${fmt(v[v.length-1])}" data-u="${u}" data-p="${v.map((y,i)=>X(i)+'|'+Y(y)+'|'+y+'|'+t[i]).join(';')}"><g fill="var(--m)" font-size="10" font-family="Bw,system-ui,sans-serif"><text x="${L-5}" y="${T+3}" text-anchor="end">${fmt(mx)}</text><text x="${L-5}" y="${B+3}" text-anchor="end">${fmt(mn)}</text><text x="${L}" y="118">${d(t[0])}</text><text x="${Rr}" y="118" text-anchor="end">${d(t[t.length-1])}</text></g>
 <path d="M${L} ${T}V${B}H${Rr}" fill="none" stroke="var(--m)" stroke-width="1" opacity=".6"/><polyline points="${pts}" fill="none" stroke="var(--ac)" stroke-width="2" stroke-linejoin="round"/>
 <g class=tip visibility=hidden><line y1="${T}" y2="${B}" stroke="var(--fg)" stroke-width="1" opacity=".35"/><circle r="4" fill="var(--ac)" stroke="var(--c)" stroke-width="2"/><rect rx="5" fill="var(--c2)"/><text font-size="11" font-weight="600" fill="var(--fg)" text-anchor="middle" font-family="Bw,system-ui,sans-serif"></text></g></svg>`}
// Touch, drag or hover on a chart: mark the nearest session and show its date and value.
function chartTip(e){const sv=e.target.closest?.('svg.chart');
 if(!sv){if(e.type=='pointerdown')document.querySelectorAll('svg.chart .tip').forEach(g=>g.setAttribute('visibility','hidden'));return}
 const r=sv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*300,pts=sv.dataset.p.split(';').map(p=>p.split('|').map(Number));
 let b=pts[0];for(const p of pts)if(Math.abs(p[0]-x)<Math.abs(b[0]-x))b=p;
 const[px,py,val,t]=b,g=sv.querySelector('.tip'),tx=g.querySelector('text'),rc=g.querySelector('rect'),u=sv.dataset.u;
 g.querySelector('line').setAttribute('x1',px);g.querySelector('line').setAttribute('x2',px);
 const c=g.querySelector('circle');c.setAttribute('cx',px);c.setAttribute('cy',py);
 tx.textContent=`${new Date(t).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'2-digit'})} · ${u=='kg'&&!(val>0)?'BW':fmt(val)+(u?' '+u:'')}`;
 g.setAttribute('visibility','visible');const w=tx.getComputedTextLength()+14,cx=Math.min(300-w/2-2,Math.max(w/2+2,px)),cy=py<30?py+22:py-12;
 tx.setAttribute('x',cx);tx.setAttribute('y',cy+4);rc.setAttribute('x',cx-w/2);rc.setAttribute('y',cy-9);rc.setAttribute('width',w);rc.setAttribute('height',18)}
addEventListener('pointermove',chartTip);addEventListener('pointerdown',chartTip);

const dk=t=>{const d=new Date(t);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};

 const by={};Object.keys(g).forEach(k=>(by[dk(+k)]??=[]).push(k));

 return`<div class=card><div class=hd><button class=s style="width:44px" data-a=calnav data-d=-1 aria-label="Previous month">‹</button><b>${label}</b><button class=s style="width:44px" data-a=calnav data-d=1 aria-label="Next month">›</button></div>

 E.days.map((dy,k)=>`<div class=card><label>Day ${k+1} name<input data-b="days.${k}.name" value="${esc(dy.name)}"></label>`+

/* ---------- backup ---------- */
const STORES=['exercises','templates','pr_history','sets'];
async function exportData(){const d={app:'liftlog',v:1,t:Date.now()};for(const n of STORES)d[n]=await all(n);d.bw=BWv()||undefined;
 const name=`liftlog-${new Date().toISOString().slice(0,10)}.json`,f=new File([JSON.stringify(d)],name,{type:'application/json'});
 try{if(navigator.canShare?.({files:[f]}))await navigator.share({files:[f]});else throw 0}
 catch(e){if(e&&e.name=='AbortError')return;const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;a.click()}
 try{localStorage.setItem(LSP+'lb',Date.now())}catch{}toast('Backup exported');render()}
/* ---------- import validation: rebuild every record from known fields only ---------- */
function clean(d){
 const num=(x,k)=>{if(typeof x!='number'||!isFinite(x))throw new Error('bad '+k);return x},
  opt=x=>typeof x=='number'&&isFinite(x)?x:undefined,
  str=(x,k)=>{if(typeof x!='string'||x.length>200)throw new Error('bad '+k);return x},
  arr=(o,n,max=2e5)=>{if(!Array.isArray(o[n])||o[n].length>max)throw new Error('bad '+n);return o[n]};
 return{t:opt(d.t)??Date.now(),bw:opt(d.bw),
  exercises:arr(d,'exercises').map(e=>{if(!['rir','pct'].includes(e.mode))throw new Error('bad mode');
   return{id:num(e.id,'id'),name:str(e.name,'name'),mode:e.mode,inc:num(e.inc,'inc'),lo:opt(e.lo),hi:opt(e.hi),rir:opt(e.rir),pb:opt(e.pb),wu:opt(e.wu),bwl:e.bwl===true?true:undefined}}),
  templates:arr(d,'templates').map(t=>({id:num(t.id,'id'),name:str(t.name,'name'),weeks:opt(t.weeks),active:t.active===true,runStart:opt(t.runStart),days:arr(Array.isArray(t.days)?t:{days:[{name:'Day 1',items:t.items}]},'days',14).map(y=>({name:str(y.name,'name'),items:arr(y,'items',200).map(i=>({exId:num(i.exId,'exId'),n:opt(i.n),lo:opt(i.lo),hi:opt(i.hi),rir:opt(i.rir),mode:i.mode=='pct'?'pct':i.mode=='rir'?'rir':undefined,
   lines:Array.isArray(i.lines)?arr(i,'lines',20).map(l=>({n:opt(l.n),r:opt(l.r),p:opt(l.p)})):undefined,rirW:Array.isArray(i.rirW)?arr(i,'rirW',60).map(v=>opt(v)??2):undefined,text:typeof i.text=='string'?i.text.slice(0,2000):undefined}))}))})),
  pr_history:arr(d,'pr_history').map(p=>({id:num(p.id,'id'),exId:num(p.exId,'exId'),w:num(p.w,'w'),t:num(p.t,'t'),setId:opt(p.setId)})),
  sets:arr(d,'sets').map(s=>({id:num(s.id,'id'),exId:num(s.exId,'exId'),sess:num(s.sess,'sess'),t:num(s.t,'t'),w:num(s.w,'w'),r:num(s.r,'r'),rir:s.rir==null?null:num(s.rir,'rir'),test:s.test===true,wu:s.wu===true?true:undefined,bw:opt(s.bw),wn:typeof s.wn=='string'?s.wn.slice(0,100):undefined,pd:typeof s.pd=='string'&&/^\d+:\d+$/.test(s.pd)?s.pd:undefined}))}}
async function importData(f){if(!f)return;let d;
 try{d=JSON.parse(await f.text());if(d.app!='liftlog'||!STORES.every(n=>Array.isArray(d[n])))throw 0}catch{return toast('Not a Lift Log backup file')}
 await applyBackup(d)}
async function applyBackup(d){
 try{d=clean(d)}catch(e){toast('Backup file is invalid ('+e.message+'). Nothing was changed.');return false}
 if(!confirm(`Replace ALL current data with the backup from ${dstr(d.t)}? (${d.sets.length} sets, ${d.exercises.length} exercises)`))return false;
 for(const n of STORES){await rq(st(n,'readwrite').clear());for(const o of d[n])await put(n,o)}
 if(d.bw>0)ls('bw',d.bw);
 W=null;saveW();S.view=null;E=null;await load();render();toast('Backup restored');return true}

/* ---------- automatic backup to a private GitHub repo ---------- */
let bt;const ls=(k,v)=>{try{localStorage.setItem(LSP+k,v)}catch{}};
const lg=k=>{try{return localStorage.getItem(LSP+k)}catch{return null}};
const ghCfg=()=>{try{return JSON.parse(lg('gh')||'null')}catch{return null}};
const ghUrl=g=>`https://api.github.com/repos/${g.repo}/contents/liftlog-backup.json`;
const ghH=(g,a='application/vnd.github+json')=>({Authorization:'Bearer '+g.token,Accept:a});
function touch(){ls('dirty','1');clearTimeout(bt);bt=setTimeout(autoBackup,15000)}
let pq=Promise.resolve();
const ghPush=g=>pq=pq.catch(()=>{}).then(async()=>{try{return await ghPush1(g)}catch(e){if(/ 409| 422/.test(e.message))return await ghPush1(g);throw e}});
async function ghPush1(g){let sha;const r0=await fetch(ghUrl(g),{headers:ghH(g),cache:'no-store'});
 if(r0.ok)sha=(await r0.json()).sha;else if(r0.status!=404)throw new Error('GitHub error '+r0.status);
 const d={app:'liftlog',v:1,t:Date.now()};for(const n of STORES)d[n]=await all(n);d.bw=BWv()||undefined;
 const r=await fetch(ghUrl(g),{method:'PUT',cache:'no-store',headers:ghH(g),body:JSON.stringify({message:'Lift Log backup',content:btoa(unescape(encodeURIComponent(JSON.stringify(d)))),sha})});
 if(!r.ok)throw new Error('GitHub error '+r.status+(r.status==422?' (stale file version, try again)':''));
 ls('lb',Date.now());ls('dirty','0');ls('gherr','')}
async function ghPull(g){const r=await fetch(ghUrl(g),{headers:ghH(g,'application/vnd.github.raw+json'),cache:'no-store'});
 if(r.status==404)return null;if(!r.ok)throw new Error('GitHub error '+r.status);return JSON.parse(await r.text())}
async function autoBackup(){const g=ghCfg();if(!g||!navigator.onLine||(!S.ex.length&&!S.sets.length))return;
 try{await ghPush(g)}catch(e){ls('gherr','Last automatic backup failed: '+e.message)}
 if(S.tab=='ex'&&!S.view)render()}
const DEFREPO='Germani144/lift-log-data';
function ghCard(){const g=ghCfg(),lb=lastBackup(),er=lg('gherr');
 return`<div class=card><b>Automatic backup (GitHub)</b>`+(g?
 `<div class=m>On → ${esc(g.repo)}. Saves a few seconds after each change${lb?'. Last backup '+age(lb):''}.</div>${er?`<div class=wr>${esc(er)}</div>`:''}<div class=row><button class=b data-a=ghNow>Back up now</button><button class=b data-a=ghRestore>Restore</button><button class=b data-a=ghOff>Turn off</button></div>`
 :`<div class=m>Use a <b>private</b> repo just for backups and a fine-grained token limited to that repo with Contents: read and write. Don't use your Pages repo.</div><form id=ghf><input name=username autocomplete=username value="${esc(DEFREPO)}" hidden><label>Repo<input id=ghr value="${esc(DEFREPO)}" autocapitalize=off></label><label>Token<input id=ght name=password type=password autocomplete=current-password></label><button class="b p" type=submit>Turn on</button></form>`)+`</div>`}
Object.assign(A,{
 ghSave:async()=>{const repo=$('#ghr').value.trim(),token=$('#ght').value.trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)||!token)return toast('Enter the repo as owner/name and a token');
  const g={repo,token};
  try{const empty=!S.ex.length&&!S.sets.length,rem=empty?await ghPull(g):null;
   ls('gh',JSON.stringify(g));
   if(rem)await applyBackup(rem);else if(!empty)await ghPush(g);
   toast('Automatic backup is on');render()}
  catch(e){toast(e.message+'. Check the repo name and token permissions.')}},
 ghNow:async()=>{try{await ghPush(ghCfg());toast('Backed up')}catch(e){ls('gherr','Last automatic backup failed: '+e.message);toast(e.message)}render()},
 ghRestore:async()=>{try{const d=await ghPull(ghCfg());d?await applyBackup(d):toast('No backup found in that repo')}catch(e){toast(e.message)}},
 ghOff:()=>{ls('gh','');render()}});
addEventListener('online',()=>ghCfg()&&autoBackup());
