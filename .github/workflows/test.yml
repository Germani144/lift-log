name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build + security checks
        run: python3 tools/build.py --check
      - name: Install headless Chromium
        run: |
          pip install playwright==1.48.0
          python3 -m playwright install --with-deps chromium
      - name: Run tests
        run: python3 tests/run.py
